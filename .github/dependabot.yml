version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns: [react, react-dom]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["@opentelemetry/*"]
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
