name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  TEST_REPORT_DIR: ci-results/structured
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx --yes npm@10 ci --prefix functions
      - run: npm ci --prefix mcp
      - run: npm run lint && npm test && npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_PROJECT_ID: demo-chaicart
          VITE_FIREBASE_APP_ID: demo-app
          VITE_FIREBASE_AUTH_DOMAIN: localhost
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:swagger && node scripts/test-node.mjs mcp mcp/test/*.test.mjs
      - run: npm run test:api-auth
      - run: npm run test:rehearsal
        env:
          CI: "1"
      - name: Report trusted-main test outcomes
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DYNATRACE_CI_ENABLED == 'true'
        run: node scripts/observability/report-tests.mjs
        env:
          DYNATRACE_CI_TOKEN: ${{ secrets.DYNATRACE_CI_TOKEN }}
          DYNATRACE_ENDPOINT: https://indiacs.live.dynatrace.com
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: structured-tests
          path: ci-results/structured
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results

  functions-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - run: npm --prefix functions test
