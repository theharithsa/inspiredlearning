name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
env:
  TEST_REPORT_DIR: ci-results/structured
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx --yes npm@10 ci --prefix functions
      - run: npm ci --prefix mcp
      - run: npm run lint && npm test && npm run build
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_PROJECT_ID: demo-chaicart
          VITE_FIREBASE_APP_ID: demo-app
          VITE_FIREBASE_AUTH_DOMAIN: localhost
      - run: npm run test:tooling && npm run test:tooling-emulator
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:security-browser && npm run test:hosting-cache
        env:
          CI: "1"
      - run: npm run test:swagger && node scripts/test-node.mjs mcp mcp/test/*.test.mjs
      - run: npm run test:api-auth
      - run: npm run test:rehearsal
        env:
          CI: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: synthetic-route-review
          path: test-results/route-review
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: structured-tests-${{ github.run_attempt }}
          path: ci-results/structured
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report
            test-results

  functions-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - run: npm --prefix functions test
