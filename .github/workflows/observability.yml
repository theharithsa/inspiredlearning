name: Delivery observability
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Checks or Review signal run (same repository)
        required: true
        type: string
      attempt:
        description: Exact source run attempt
        required: true
        type: string
      replay_hosting_observation:
        description: Replay reviewed 30 October Hosting facts (original times; no deploy)
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [Checks, Review signal]
    types: [completed]
  issues:
    types: [opened, closed, reopened]
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, synchronize]
  release:
    types: [published]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
jobs:
  report:
    # Explicit secure binding required; skipped is not a verified ingest result.
    if: vars.DYNATRACE_CI_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: Production
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install trusted reporter dependencies
        run: npm ci --prefix functions --ignore-scripts
      - name: Report source-confirmed lifecycle and execution facts
        run: node scripts/observability/report-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DYNATRACE_CI_TOKEN: ${{ secrets.DYNATRACE_CI_TOKEN }}
          DYNATRACE_ENDPOINT: https://indiacs.live.dynatrace.com
      - name: Preserve sanitized retry state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: telemetry-spool-${{ github.run_id }}-${{ github.run_attempt }}
          path: .observability/spool
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
